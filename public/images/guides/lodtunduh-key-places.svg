<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <title>Lodtunduh key places - everyday anchors</title>
  <desc>Modern infographic of everyday anchors in Lodtunduh Ubud for long-stay renters.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow2" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#1c1917" flood-opacity="0.07"/>
    </filter>
    <pattern id="dots2" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e7e5e4"/>
    </pattern>
  </defs>

  <rect width="1200" height="680" fill="url(#bg2)"/>
  <rect width="1200" height="680" fill="url(#dots2)" opacity="0.45"/>

  <rect x="48" y="44" width="4" height="48" rx="2" fill="url(#accent2)"/>
  <text x="68" y="68" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1c1917">Everyday anchors in Lodtunduh</text>
  <text x="68" y="94" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#78716c">Places long-stay renters actually use - not a tourist checklist</text>

  <!-- Card template positions -->
  <!-- Row 1 -->
  <g filter="url(#shadow2)">
    <rect x="48" y="130" width="258" height="148" rx="18" fill="#ffffff" stroke="#d1fae5" stroke-width="1"/>
    <rect x="48" y="130" width="258" height="5" rx="2.5" fill="#059669"/>
    <circle cx="82" cy="168" r="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <path d="M74 168 h16 M82 160 v16" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <text x="112" y="164" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#065f46">Titi Batu Club</text>
    <text x="112" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#047857">Pool, gym, sauna, kids, padel</text>
    <text x="112" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#047857">Club vibe - not pretentious</text>
    <text x="72" y="252" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#059669">#1 search anchor in the area</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="324" y="130" width="258" height="148" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
    <rect x="324" y="130" width="258" height="5" rx="2.5" fill="#ea580c"/>
    <circle cx="358" cy="168" r="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <path d="M350 172 c6-8 12-8 16 0" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
    <text x="388" y="164" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9a3412">Usha Cafe</text>
    <text x="388" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c2410c">Oldest local favorite + bakery</text>
    <text x="388" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c2410c">Unpretentious, reliable</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="600" y="130" width="258" height="148" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <rect x="600" y="130" width="258" height="5" rx="2.5" fill="#ca8a04"/>
    <circle cx="634" cy="168" r="18" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
    <rect x="626" y="160" width="16" height="12" rx="3" fill="none" stroke="#ca8a04" stroke-width="2"/>
    <text x="664" y="164" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#854d0e">7AM Bakers</text>
    <text x="664" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#a16207">Chain bakery on the crossroads</text>
    <text x="664" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#a16207">Opposite fitness cluster</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="876" y="130" width="276" height="148" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <rect x="876" y="130" width="276" height="5" rx="2.5" fill="#16a34a"/>
    <circle cx="910" cy="168" r="18" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <path d="M902 176 h16 M906 168 v12 M914 168 v12" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <text x="940" y="164" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#166534">Pelangi School</text>
    <text x="940" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#15803d">International school for families</text>
    <text x="940" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#15803d">Near Titi Batu corridor</text>
  </g>

  <!-- Row 2 -->
  <g filter="url(#shadow2)">
    <rect x="48" y="300" width="258" height="148" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <rect x="48" y="300" width="258" height="5" rx="2.5" fill="#e11d48"/>
    <circle cx="82" cy="338" r="18" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
    <path d="M74 346 h16 M82 330 v10 M90 338 v8" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <text x="112" y="334" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9f1239">Fitness cluster</text>
    <text x="112" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#be123c">Ubud Fitness + CrossFit</text>
    <text x="112" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#be123c">Low valley with trees</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="324" y="300" width="258" height="148" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <rect x="324" y="300" width="258" height="5" rx="2.5" fill="#059669"/>
    <circle cx="358" cy="338" r="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="358" cy="342" r="6" fill="#059669"/>
    <text x="388" y="334" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#065f46">Bu Ayu fruit shop</text>
    <text x="388" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#047857">Affordable fruit on A.A. Gede Rai</text>
    <text x="388" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#047857">Personal local favorite</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="600" y="300" width="258" height="148" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1"/>
    <rect x="600" y="300" width="258" height="5" rx="2.5" fill="#57534e"/>
    <circle cx="634" cy="338" r="18" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="1.5"/>
    <path d="M626 350 c4-10 12-14 16-4 c4-10 12-6 16 4" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round"/>
    <text x="664" y="334" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#292524">Westin belt</text>
    <text x="664" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57534e">Old trees, rice exits, river valley</text>
    <text x="664" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57534e">Old Ubud scale feeling</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="876" y="300" width="276" height="148" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
    <rect x="876" y="300" width="276" height="5" rx="2.5" fill="#ea580c"/>
    <circle cx="910" cy="338" r="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <path d="M902 338 h16 M906 334 v8 M914 334 v8" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
    <text x="940" y="334" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9a3412">Errands outside area</text>
    <text x="940" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c2410c">Pepito, Bintang, Delta in Peliatan</text>
    <text x="940" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c2410c">Fuel in Peliatan or south Mas</text>
  </g>

  <!-- Footer note -->
  <g filter="url(#shadow2)">
    <rect x="48" y="490" width="1104" height="56" rx="14" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
    <text x="76" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#78716c">Tap Google Maps links in the article for exact pins | Balitrusted Lodtunduh area guide</text>
  </g>
</svg>
