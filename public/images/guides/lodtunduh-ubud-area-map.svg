<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <title>Lodtunduh area map - Ubud south pocket</title>
  <desc>Schematic map of Lodtunduh showing north urban vs south green zones, Jl A.A. Gede Rai, and key access points.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="urbanFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="greenFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1c1917" flood-opacity="0.08"/>
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1c1917" flood-opacity="0.1"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e7e5e4"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#78716c"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>
  <rect width="1200" height="780" fill="url(#dots)" opacity="0.55"/>

  <!-- Header -->
  <rect x="48" y="40" width="4" height="52" rx="2" fill="url(#accent)"/>
  <text x="68" y="68" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1c1917">Lodtunduh, Ubud</text>
  <text x="68" y="96" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#78716c">Area schematic | north urban vs south green | traffic times are approximate</text>

  <!-- Ubud center pill -->
  <g filter="url(#pillShadow)">
    <rect x="880" y="118" width="168" height="72" rx="36" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="916" cy="154" r="10" fill="#f59e0b"/>
    <text x="936" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#92400e">Ubud center</text>
    <text x="936" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b45309">5-10 min scooter</text>
  </g>

  <!-- North zone card -->
  <g filter="url(#cardShadow)">
    <rect x="300" y="130" width="420" height="148" rx="20" fill="url(#urbanFill)" stroke="#e7e5e4" stroke-width="1"/>
    <rect x="300" y="130" width="420" height="6" rx="3" fill="#a8a29e"/>
    <text x="330" y="172" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#292524">North and central Lodtunduh</text>
    <text x="330" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57534e">Dense villas | main-road buzz | Usha, 7AM, fitness cluster</text>
    <text x="330" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57534e">Closer to Pepito Peliatan and Ubud center</text>
    <text x="330" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#78716c">Feels more urban</text>
  </g>

  <!-- South zone card -->
  <g filter="url(#cardShadow)">
    <rect x="300" y="470" width="420" height="148" rx="20" fill="url(#greenFill)" stroke="#a7f3d0" stroke-width="1"/>
    <rect x="300" y="470" width="420" height="6" rx="3" fill="#059669"/>
    <text x="330" y="512" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#14532d">South Lodtunduh</text>
    <text x="330" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#166534">Rice views | Westin green belt | larger plots</text>
    <text x="330" y="564" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#166534">12-15 min to Ubud center from many villas</text>
    <text x="330" y="594" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#047857">Feels more open and green</text>
  </g>

  <!-- Main road spine -->
  <rect x="498" y="290" width="24" height="168" rx="12" fill="url(#road)"/>
  <text x="510" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#fafaf9" transform="rotate(-90 510 382)">Jl. A.A. Gede Rai</text>

  <!-- Ambarawati hub -->
  <g filter="url(#pillShadow)">
    <circle cx="510" cy="318" r="28" fill="#fff" stroke="#ef4444" stroke-width="3"/>
    <circle cx="510" cy="318" r="10" fill="#ef4444"/>
    <text x="556" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Ambarawati crossroads</text>
    <text x="556" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7f1d1d">Main traffic | Mas right | Denpasar/Canggu left</text>
  </g>

  <!-- Titi Batu (east / right of main road) -->
  <g filter="url(#cardShadow)">
    <rect x="548" y="350" width="168" height="88" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="578" cy="382" r="14" fill="#059669"/>
    <text x="602" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#065f46">Titi Batu</text>
    <text x="602" y="396" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#047857">Club | pool | gym lane</text>
    <text x="602" y="414" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#059669">Right off A.A. Gede Rai</text>
  </g>

  <!-- Pepito -->
  <g filter="url(#cardShadow)">
    <rect x="760" y="228" width="156" height="72" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="790" cy="264" r="12" fill="#ea580c"/>
    <text x="812" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Pepito Peliatan</text>
    <text x="812" y="278" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c2410c">Nearest big supermarket</text>
  </g>

  <!-- Canggu west -->
  <g filter="url(#cardShadow)">
    <rect x="48" y="248" width="148" height="88" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <circle cx="78" cy="284" r="12" fill="#7c3aed"/>
    <text x="100" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Canggu west</text>
    <text x="100" y="296" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6d28d9">Best Ubud-side road out</text>
    <text x="100" y="316" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7c3aed">35-50 min typical</text>
  </g>

  <!-- Mas -->
  <g filter="url(#cardShadow)">
    <rect x="760" y="452" width="132" height="72" rx="16" fill="#ffffff" stroke="#bef264" stroke-width="1.5"/>
    <circle cx="790" cy="488" r="12" fill="#65a30d"/>
    <text x="812" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#3f6212">Mas south</text>
    <text x="812" y="502" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4d7c0f">Greener | further from center</text>
  </g>

  <!-- Connectors -->
  <path d="M196 284 C260 284, 430 300, 482 318" fill="none" stroke="#d6d3d1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M760 264 L548 318" fill="none" stroke="#d6d3d1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M880 190 L720 228" fill="none" stroke="#d6d3d1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M522 394 L548 394" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M538 428 L760 488" fill="none" stroke="#d6d3d1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M510 458 L510 470" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Legend bar -->
  <g filter="url(#cardShadow)">
    <rect x="48" y="660" width="1104" height="88" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
    <text x="76" y="692" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#292524">Typical scooter times (traffic dependent)</text>
    <text x="76" y="718" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57534e">Ubud center 5-10 min | Pepito ~5 min | Titi Batu ~3-5 min | Canggu 35-50 min | South villas 12-15 min to center</text>
    <text x="76" y="738" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#a8a29e">Balitrusted guide | schematic only | verify your exact villa on Google Maps</text>
  </g>
</svg>
