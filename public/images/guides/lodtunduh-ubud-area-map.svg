<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <title>Lodtunduh area map - Ubud south pocket</title>
  <desc>Schematic map of Lodtunduh showing Jl A.A. Gede Rai spine, Ambarawati intersection, Titi Batu corridor, Pepito Peliatan, and Canggu west access.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="urban" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#57534e"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1c1917">Lodtunduh, Ubud - area schematic</text>
  <text x="32" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57534e">South Ubud pocket | urban north | greener south | best Canggu access from Ubud</text>
  <ellipse cx="760" cy="110" rx="72" ry="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="760" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#92400e">Ubud center</text>
  <text x="760" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#92400e">5-10 min scooter</text>
  <rect x="280" y="88" width="420" height="120" rx="16" fill="url(#urban)" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="490" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#44403c">North and central Lodtunduh</text>
  <text x="490" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57534e">Dense villa lanes | asphalt | hotter | less walkable green</text>
  <text x="490" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57534e">Usha | 7AM | Ubud Fitness | fruit stalls</text>
  <rect x="280" y="380" width="420" height="150" rx="16" fill="url(#green)" stroke="#86efac" stroke-width="1.5"/>
  <text x="490" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#166534">South Lodtunduh</text>
  <text x="490" y="436" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#15803d">More space | rice views | Westin green belt</text>
  <text x="490" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#15803d">12-15 min to Ubud center | slower, scenic</text>
  <rect x="468" y="210" width="44" height="170" rx="8" fill="#78716c"/>
  <text x="490" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#fafaf9" transform="rotate(-90 490 300)">Jl. A.A. Gede Rai</text>
  <circle cx="490" cy="248" r="22" fill="#dc2626" stroke="#fff" stroke-width="3"/>
  <text x="490" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">X</text>
  <text x="620" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#991b1b">Ambarawati crossroads</text>
  <text x="620" y="254" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57534e">Main traffic jam | Mas right | Denpasar/Canggu left</text>
  <rect x="340" y="286" width="110" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="395" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Titi Batu</text>
  <text x="395" y="334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1e40af">club | pool | gym</text>
  <text x="395" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1e40af">tile walk lane</text>
  <rect x="620" y="168" width="130" height="56" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="685" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#9a3412">Pepito Peliatan</text>
  <text x="685" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#9a3412">nearest big supermarket</text>
  <rect x="48" y="260" width="150" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="123" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Canggu - west</text>
  <text x="123" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b21b6">Best Ubud-side access</text>
  <rect x="620" y="320" width="130" height="56" rx="10" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/>
  <text x="685" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#3f6212">Mas</text>
  <text x="685" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3f6212">greener | further south</text>
  <line x1="198" y1="296" x2="330" y2="296" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="150" x2="620" y2="196" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="512" y1="248" x2="618" y2="248" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="512" y1="348" x2="618" y2="348" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="32" y="548" width="896" height="72" rx="12" fill="#fff" stroke="#e7e5e4"/>
  <text x="52" y="574" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#292524">Typical scooter times (traffic dependent)</text>
  <text x="52" y="598" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57534e">Ubud center 5-10 min (north) | Pepito Peliatan ~5 min | Titi Batu ~3-5 min | Canggu 35-50 min | South Lodtunduh villas 12-15 min to center</text>
  <text x="52" y="614" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#78716c">Balitrusted guide | schematic only | check exact villa on Google Maps before signing</text>
</svg>
